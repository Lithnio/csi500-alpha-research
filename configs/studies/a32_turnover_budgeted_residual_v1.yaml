study:
  id: a32-turnover-budgeted-residual-v1
  base_config: ../extended_validation_2023_2025.yaml
  max_trials: 2

selection:
  primary_tolerance: 0.10
  gates:
    - path: quality_passed
      operator: "=="
      value: true
    - path: optimizer_solve_rate
      operator: ">="
      value: 0.95
    - path: evaluation.yearly.positive_active_year_fraction
      operator: ">="
      value: 0.66
  primary:
    path: evaluation.yearly.median_information_ratio
    direction: maximize
  tie_breakers:
    - path: metrics.information_ratio
      direction: maximize
    - path: evaluation.yearly.minimum_information_ratio
      direction: maximize
    - path: metrics.active_max_drawdown
      direction: maximize
    - path: metrics.average_turnover
      direction: minimize

trials:
  - id: a0_frozen_reference
    purpose: Preserve the A0 selector and family-equal model as the control.
    overrides:
      workflow:
        factors: &expanded_factors
          - reversal_1d
          - reversal_5d
          - reversal_10d
          - reversal_20d
          - momentum_20_5
          - momentum_60_20
          - momentum_120_20
          - momentum_250_20
          - low_vol_20
          - low_downside_vol_60
          - low_range_vol_20
          - beta_60
          - low_idio_vol_60
          - skewness_60
          - max_return_20
          - amihud_20
          - free_turnover_20
          - turnover_shock_5_60
          - zero_return_20
          - close_location_20
          - size
          - total_size
          - free_float_ratio
          - book_to_price
          - abnormal_turnover_reversal
          - gross_profitability_ttm
          - roe_ttm
          - roa_ttm
          - operating_margin_ttm
          - cash_return_on_assets_ttm
          - book_to_market
          - earnings_yield_ttm
          - sales_to_price_ttm
          - cfo_yield_ttm
          - revenue_growth_ttm_yoy
          - earnings_growth_ttm_yoy
          - cfo_growth_ttm_yoy
          - roe_change_yoy
          - asset_growth_yoy
          - capex_intensity_ttm
          - total_accruals_ttm
          - cash_conversion_ttm
          - market_residual_momentum_120_20
          - turnover_volatility_20
          - high_turnover_return_20
          - intraday_strength_20
          - limit_up_close_rate_20
          - failed_limit_up_rate_20
          - limit_adjusted_momentum_120_20
          - high_price_momentum_250_20
          - overnight_intraday_divergence_20
          - limit_down_close_rate_20
          - failed_limit_down_rate_20
        feature_provider:
          name: builtin_a3_daily_fundamental
          params:
            max_financial_age_days: 180
        selector:
          name: stability_cost
          params: &core_selector
            min_coverage: 0.80
            min_active_date_rate: 0.80
            min_cross_section: 100
            min_ic_dates: 100
            min_mean_directed_ic: 0.0
            min_direction_consistency: 0.50
            segments: 4
            min_segment_selection_frequency: 0.50
            min_mean_net_quintile_spread: 0.0
            min_net_spread_consistency: 0.50
            min_joint_segment_frequency: 0.50
            min_newey_west_t: 0.0
            max_bh_q_value: 0.20
            min_quintile_monotonicity: 0.0
            max_score_churn: 0.35
            max_abs_correlation: 0.75
            min_factors: 5
            max_factors: 10
            max_per_family: 2
            max_per_cluster: 1
            lookback_dates: 156
            churn_penalty: 0.05
            linear_cost_bps: 5.0
            stamp_duty_change_date: "20230828"
            stamp_duty_before: 0.001
            stamp_duty_after: 0.0005
            excluded_factors: &incremental_factors
              - market_residual_momentum_120_20
              - turnover_volatility_20
              - high_turnover_return_20
              - intraday_strength_20
              - limit_up_close_rate_20
              - failed_limit_up_rate_20
              - limit_adjusted_momentum_120_20
              - high_price_momentum_250_20
              - overnight_intraday_divergence_20
              - limit_down_close_rate_20
              - failed_limit_down_rate_20
        model:
          name: family_direction_equal
          params: &family_model
            min_cross_section: 100
            min_training_rows: 1000
            min_training_dates: 100
            min_ic_dates: 100
            lookback_dates: 156
            ridge_alpha: 10.0
            min_factor_fraction: 0.50
            min_family_fraction: 0.50
            min_active_factors: 5
            min_active_families: 3
            max_factor_weight: 0.20
            max_family_weight: 0.35
        calibrator:
          name: rolling_ridge
          params: &calibrator
            alpha: 10.0
            min_training_rows: 1000
            min_training_dates: 12
            score_clip: 3.0
            label_clip: 0.20
            max_abs_slope: 0.05
            max_abs_expected_return: 0.10

  - id: a32_turnover_budgeted_residual
    purpose: Weight residual candidates by net stability and cap their score-churn translation cost.
    overrides:
      workflow:
        factors: *expanded_factors
        feature_provider:
          name: builtin_a3_daily_fundamental
          params:
            max_financial_age_days: 180
        selector:
          name: incremental_stability_cost
          params:
            candidate_factors: *incremental_factors
            min_core_fraction: 0.50
            min_residual_variance_ratio: 0.05
            core: *core_selector
            additions:
              min_coverage: 0.80
              min_active_date_rate: 0.80
              min_cross_section: 100
              min_ic_dates: 100
              min_mean_directed_ic: 0.0
              min_direction_consistency: 0.50
              segments: 4
              min_segment_selection_frequency: 0.50
              min_mean_net_quintile_spread: 0.0
              min_net_spread_consistency: 0.50
              min_joint_segment_frequency: 0.50
              min_newey_west_t: 0.0
              max_bh_q_value: 0.20
              min_quintile_monotonicity: 0.0
              max_score_churn: 0.35
              max_abs_correlation: 0.75
              min_factors: 1
              max_factors: 6
              max_per_family: 2
              max_per_cluster: 1
              lookback_dates: 156
              churn_penalty: 0.05
              linear_cost_bps: 5.0
              stamp_duty_change_date: "20230828"
              stamp_duty_before: 0.001
              stamp_duty_after: 0.0005
        model:
          name: turnover_budgeted_residual_sleeve
          params:
            candidate_factors: *incremental_factors
            min_core_fraction: 0.50
            min_candidate_fraction: 0.50
            min_cross_section: 100
            min_sleeve_dates: 100
            lookback_dates: 156
            oof_segments: 4
            min_oof_train_dates: 36
            min_oof_blocks: 2
            min_oof_positive_block_fraction: 0.50
            min_oof_t: 1.0
            oof_target_t: 2.0
            candidate_weighting_method: net_stability
            candidate_recent_segments: 2
            min_candidate_recent_positive_fraction: 0.50
            min_candidate_weight_t: 1.0
            candidate_weight_full_confidence_t: 3.0
            candidate_churn_floor: 0.02
            max_blend_churn_ratio: 1.50
            turnover_budget_grid_size: 41
            hac_max_lags: 4
            risk_aversion: 3.0
            candidate_anchor_penalty: 0.001
            candidate_change_penalty: 0.001
            linear_cost_bps: 5.0
            stamp_duty_change_date: "20230828"
            stamp_duty_before: 0.001
            stamp_duty_after: 0.0005
            core: *family_model
        calibrator:
          name: rolling_ridge
          params: *calibrator
