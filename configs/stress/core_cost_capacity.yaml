stress:
  id: core-cost-capacity-v2
  source_study: ../studies/core_baselines.yaml
  max_scenarios: 10
  baseline_parity_tolerance: 1.0e-8

scenarios:
  - id: baseline
    purpose: Reproduce the selected trial portfolio exactly before applying stress.

  - id: cost_0_5x
    purpose: Reoptimize after halving linear, stamp-duty and impact assumptions.
    execution_mode: reoptimized
    cost_multiplier: 0.5

  - id: cost_2_0x
    purpose: Reoptimize after doubling linear, stamp-duty and impact assumptions.
    execution_mode: reoptimized
    cost_multiplier: 2.0

  - id: cost_0_5x_frozen
    purpose: Replay identical gross trades with all modeled costs halved.
    execution_mode: frozen_trades
    cost_multiplier: 0.5

  - id: cost_2_0x_frozen
    purpose: Replay identical gross trades with all modeled costs doubled.
    execution_mode: frozen_trades
    cost_multiplier: 2.0

  - id: aum_50m
    purpose: Test liquidity and impact at CNY 50 million portfolio AUM.
    portfolio_aum_cny: 50000000

  - id: aum_300m
    purpose: Test liquidity and impact at CNY 300 million portfolio AUM.
    portfolio_aum_cny: 300000000

  - id: participation_10pct
    purpose: Allow trading up to 10 percent of observed daily amount.
    max_adv_participation: 0.10

  - id: participation_20pct
    purpose: Allow trading up to 20 percent of observed daily amount.
    max_adv_participation: 0.20
