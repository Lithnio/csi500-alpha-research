[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "csi500-alpha"
version = "1.0.0"
description = "Point-in-time CSI 500 factor research and cost-aware active portfolio construction."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [{ name = "Project contributors" }]
dependencies = [
  "numpy>=2.0,<3",
  "pandas>=2.2,<4",
  "pyarrow>=17,<24",
  "PyYAML>=6,<7",
  "python-dotenv>=1,<2",
  "requests>=2.32,<3",
  "scikit-learn>=1.5,<2",
  "scipy>=1.13,<2",
  "statsmodels>=0.14,<1",
  "tushare>=1.4.29,<2",
  "cvxpy>=1.6,<2",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pip-licenses>=5,<6",
  "pytest>=8.3,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.8,<1",
  "types-PyYAML>=6.0.12,<7",
]
report = [
  "matplotlib>=3.9,<4",
]

[project.scripts]
csi500-alpha = "csi500_alpha.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
markers = [
  "integration: tests that require external credentials or network access",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
